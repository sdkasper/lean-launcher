name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse tracked signing keys
        shell: pwsh
        run: |
          $tracked = git ls-files -- '*.key' '*.minisig'
          if ($tracked) {
            Write-Error "Signing key material must never be committed: $($tracked -join ', ')"
            exit 1
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -S . -B cmake -A x64

      - name: Build with CMake (Release x64)
        run: cmake --build cmake --config Release

      - name: Run Core Tests (CTest)
        run: ctest --test-dir cmake -C Release -V --output-on-failure

      - name: Verify Visual Studio Solution Build
        run: msbuild LeanLauncher.sln /p:Configuration=Release /p:Platform=x64 /v:m
